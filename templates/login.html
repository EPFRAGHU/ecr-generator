<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — EPFO Monthly ECR Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="masthead">
  <div>
    <h1>EPFO Monthly ECR Generator</h1>
    <p class="sub">Monthly contribution register — prepared for upload to the EPFO Unified Portal</p>
  </div>
  <div class="masthead-right">
    <div class="office">Developed by Raghunatha Maharana, EO, EPFO, District Office, Cuttack, Odisha</div>
    <div class="office">Employer Module</div>
  </div>
</div>

<div class="login-card">
  <h2>Admin log in</h2>
  {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="username">User ID</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn-generate" type="submit">Log in</button>
  </form>
</div>

</body>
</html>
